[workspace]
members = ["src/programs/reserved"]
resolver = "2"

[profile.release]
overflow-checks = true

[workspace.dependencies]
blake3 = "=1.8.2"
indexmap = "=2.2.6"
proc-macro-crate = "=3.2.0"
unicode-segmentation = "=1.11.0"
borsh = "=1.5.7"
pinocchio = "=0.9.2"

# rustc < 1.82 / stable SBF: patch crates that need nightly-only APIs
[patch.crates-io]
light-program-profiler = { path = "vendor/light-program-profiler" }
light-sdk-macros = { path = "vendor/light-sdk-macros" }
light-sdk-types = { path = "vendor/light-sdk-types" }